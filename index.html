<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Praxis: gestão de compras corporativas. Solicitações, cotações, aprovações e pagamentos num fluxo só, com prazo, responsável e histórico em cada etapa.">
  <meta name="author" content="Alyssom Fernandes · AFN Systems">
  <meta name="theme-color" content="#13100D">
  <meta name="color-scheme" content="dark light">

  <!-- Tema salvo (antes de qualquer pintura), registro de erros e saída do
       splash: js/inicio.js (sem script inline, por causa da CSP) -->
  <script src="/js/inicio.js"></script>

  <!-- Open Graph -->
  <meta property="og:type"         content="website">
  <meta property="og:site_name"    content="Praxis">
  <meta property="og:locale"       content="pt_BR">
  <meta property="og:url"          content="https://praxis-af618.web.app/">
  <meta property="og:title"        content="Praxis · Toda compra tem um caminho. Do pedido ao pagamento.">
  <meta property="og:description"  content="Solicitações, cotações, aprovações e pagamentos num fluxo só, com prazo, responsável e histórico em cada etapa. Explore a demonstração.">
  <meta property="og:image"        content="https://praxis-af618.web.app/assets/og-image.png">
  <meta property="og:image:width"  content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt"    content="Praxis, gestão de compras corporativas">

  <!-- Twitter Card -->
  <meta name="twitter:card"        content="summary_large_image">
  <meta name="twitter:title"       content="Praxis · Toda compra tem um caminho. Do pedido ao pagamento.">
  <meta name="twitter:description" content="Solicitações, cotações, aprovações e pagamentos num fluxo só, com prazo, responsável e histórico em cada etapa.">
  <meta name="twitter:image"       content="https://praxis-af618.web.app/assets/og-image.png">
  <meta name="twitter:image:alt"   content="Praxis, gestão de compras corporativas">

  <title>Praxis · Gestão de compras corporativas</title>

  <!-- Fontes do próprio site (css/fontes.css): as da primeira tela vêm antes -->
  <link rel="preload" href="/assets/fonts/hanken-grotesk-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/assets/fonts/gfs-didot-400-latin.woff2" as="font" type="font/woff2" crossorigin>

  <!-- Módulos da entrada, pedidos em paralelo: sem isto o navegador só descobre
       o SDK do Firebase depois de ler app.js e firebase.js (três idas e voltas).
       Prioridade baixa: no celular lento o CSS, que segura a pintura, vem antes -->
  <link rel="modulepreload" href="https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js" crossorigin fetchpriority="low">
  <link rel="modulepreload" href="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js" crossorigin fetchpriority="low">
  <link rel="modulepreload" href="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js" crossorigin fetchpriority="low">
  <link rel="modulepreload" href="https://www.gstatic.com/firebasejs/10.12.0/firebase-storage.js" crossorigin fetchpriority="low">
  <link rel="modulepreload" href="/js/firebase.js" fetchpriority="low">
  <link rel="modulepreload" href="/js/constants.js" fetchpriority="low">
  <link rel="modulepreload" href="/js/ui.js" fetchpriority="low">
  <link rel="modulepreload" href="/js/auth.js" fetchpriority="low">

  <!-- PWA -->
  <link rel="manifest" href="/manifest.json">

  <!-- Favicon: o triângulo vazado (SVG acompanha o tema do sistema) -->
  <link rel="icon" type="image/svg+xml" href="/assets/logo/praxis-icon.svg">
  <link rel="icon" href="/assets/logo/praxis-favicon.ico" sizes="16x16 32x32 48x48">
  <link rel="apple-touch-icon" href="/assets/logo/praxis-apple-touch.png">

  <!-- CSS -->
  <link rel="stylesheet" href="/css/fontes.css?v=14">
  <link rel="stylesheet" href="/css/tokens.css?v=14">
  <link rel="stylesheet" href="/css/base.css?v=14">
  <link rel="stylesheet" href="/css/components.css?v=14">
  <link rel="stylesheet" href="/css/views.css?v=14">
  <link rel="stylesheet" href="/css/themes.css?v=14">

  <style>
    /* Splash de carregamento inicial — usa os tokens, então segue o tema salvo.
       Mostra o símbolo (SVG): não depende da fonte do letreiro ter chegado. */
    #splash {
      position: fixed;
      inset: 0;
      z-index: 99999;
      background: var(--bg, #13100D);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 1.4rem;
      transition: opacity 0.35s ease;
    }
    #splash.hide { opacity: 0; pointer-events: none; }
    .splash-simbolo { width: 44px; height: 44px; color: var(--text, #EFE5D6); }
    .splash-barra {
      position: relative;
      width: 72px;
      height: 2px;
      overflow: hidden;
      background: var(--line, #2B241D);
    }
    .splash-barra::after {
      content: '';
      position: absolute;
      top: 0; bottom: 0;
      width: 40%;
      background: var(--gold, #D2693F);
      animation: splashCorre 1.1s cubic-bezier(0.45, 0, 0.55, 1) infinite;
    }
    @keyframes splashCorre { from { left: -40%; } to { left: 100%; } }
    @media (prefers-reduced-motion: reduce) {
      .splash-barra::after { animation: none; left: 30%; }
    }
  </style>
</head>
<body>

  <!-- Splash inicial (primeiro elemento do body: pinta antes de tudo) -->
  <div id="splash" role="status" aria-label="Carregando o Praxis">
    <svg class="splash-simbolo" viewBox="60 86 480 480" aria-hidden="true"><path fill="currentColor" fill-rule="evenodd" d="M296 100H323L466 527V535H521V553H77V535Q128 535 145 495ZM289 197L185 470Q172 505 175 525Q180 535 215 535H405Z"/></svg>
    <div class="splash-barra"></div>
  </div>

  <!-- Spinner global de loading -->
  <div id="spinner-overlay" role="status" aria-label="Carregando">
    <div class="spinner"></div>
  </div>

  <!-- Toast container -->
  <div id="toast-container" aria-live="polite" aria-atomic="false"></div>

  <!-- App root -->
  <div id="app"></div>

  <!-- App entry point -->
  <script type="module" src="/js/app.js"></script>


</body>
</html>
