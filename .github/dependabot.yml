version: 2
# Minor e patch chegam agrupados num PR por ecossistema; versões maiores ficam de fora
# e são atualizadas à mão, quando houver tempo de conferir as mudanças.
updates:
  # Ferramentas da raiz: Firebase CLI, SDK e testes das regras
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    groups:
      menores:
        update-types: [minor, patch]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # Cloud Functions
  - package-ecosystem: npm
    directory: /functions
    schedule:
      interval: monthly
    groups:
      menores:
        update-types: [minor, patch]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # Ações do GitHub Actions
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      menores:
        update-types: [minor, patch]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
