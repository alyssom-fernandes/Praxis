name: Testes

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  regras:
    name: Regras do Firestore e do Storage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # O @firebase/rules-unit-testing 6 pede Node 24.12 ou mais novo
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      # O emulador do Firestore roda em Java
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Dependências
        run: npm ci

      - name: Lint do front (ESLint)
        run: npm run lint

      - name: Tipos das regras do app (TypeScript, sem compilar)
        run: npm run tipos

      - name: Sintaxe dos módulos do app
        run: for f in js/*.js tests/*.mjs; do node --check "$f"; done

      - name: Testes de unidade (app, textos, contraste e foco, Functions)
        run: npm run testar-unidade

      - name: Cache dos emuladores
        uses: actions/cache@v6
        with:
          path: ~/.cache/firebase/emulators
          key: emuladores-${{ hashFiles('package-lock.json') }}

      - name: Testes das regras (emulador)
        run: npm run testar-regras

  e2e:
    name: Ponta a ponta (navegador e emuladores)
    # Versão fixa: o instalador de dependências do Playwright conhece cada
    # versão do Ubuntu, e o ubuntu-latest passou a apontar para o 26
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      # O seed dos emuladores usa o firebase-admin das Functions
      - name: Dependências (app e Functions)
        run: |
          npm ci
          npm ci --prefix functions

      - name: Navegador (Chromium sem janela)
        run: npx playwright install --with-deps --only-shell chromium

      - name: Cache dos emuladores
        uses: actions/cache@v6
        with:
          path: ~/.cache/firebase/emulators
          key: emuladores-${{ hashFiles('package-lock.json') }}

      - name: Caminho feliz, celular (390 e 360, axe-core, CSP da produção) e sem internet
        run: npm run testar-e2e

      # Lighthouse na entrada, servida como no Hosting: as quatro notas no mínimo 90
      - name: Lighthouse (desempenho, acessibilidade, boas práticas e SEO)
        run: npm run lighthouse
        env:
          LIMITE: 90
          RODADAS: 3

  functions:
    name: Lint das Cloud Functions
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Dependências
        run: npm ci

      - name: Lint
        run: npm run lint
